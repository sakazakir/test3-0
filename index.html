<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FaBrary Draft Deck Analyzer</title>
<style>
:root{color-scheme:dark;--bg:#111827;--panel:#1f2937;--line:#4b5563;--muted:#9ca3af;--red:#ef4444;--yellow:#eab308;--blue:#3b82f6;--error:#fca5a5;--ok:#86efac}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f9fafb;font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif}.wrap{max-width:1400px;margin:auto;padding:28px 4% 60px}h1{margin:0 0 8px}h2{margin:0 0 16px}.muted,.hint{color:var(--muted)}.panel,.summary{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:18px 0}textarea{width:100%;min-height:360px;background:#0b1220;color:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;font:14px/1.55 monospace}textarea:focus{outline:2px solid #6366f1}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:7px;padding:10px 15px;background:#4f46e5;color:white;font-weight:700;cursor:pointer}button.secondary{background:#4b5563}label{color:var(--muted);font-size:14px}.status{min-height:24px;margin-top:12px}.error{color:var(--error)}.ok{color:var(--ok)}.error-box{margin-top:12px;padding:12px;border:1px solid #991b1b;border-radius:8px;background:#450a0a;color:#fecaca}.error-box h3{margin:0 0 8px;font-size:15px}.error-box ul{margin:0;padding-left:22px}.info-box{margin:14px 0;padding:12px 14px;border-left:4px solid #818cf8;background:#172554;color:#dbeafe}.info-box h3{margin:0 0 6px;font-size:15px}.info-box p{margin:4px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.summary{margin:0;border-top:4px solid #9ca3af}.summary.red{border-top-color:var(--red)}.summary.yellow{border-top-color:var(--yellow)}.summary.blue{border-top-color:var(--blue)}.summary .label{color:var(--muted);font-size:13px}.summary .value{font-size:30px;font-weight:800}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:10px 12px;border-bottom:1px solid #374151;text-align:left}th{background:#273244;color:#d1d5db;font-size:13px}.scroll{overflow:auto}.badge{display:inline-block;min-width:42px;text-align:center;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700}.red.badge{background:var(--red)}.yellow.badge{background:var(--yellow);color:#111}.blue.badge{background:var(--blue)}.hidden{display:none}code{color:#c4b5fd}.small{font-size:13px;color:var(--muted)}
</style>
</head>
<body><main class="wrap">
<h1>FaBrary Draft Deck Analyzer</h1>
<p class="muted">FaBrary形式の複数デッキリストから、赤・黄・青カードの平均枚数とカード別統計を計算します。</p>
<section class="panel"><h2>デッキリスト入力</h2><textarea id="input" spellcheck="false"></textarea>
<div class="controls"><button id="analyze">分析する</button><button class="secondary" id="sample">サンプルを読み込む</button><button class="secondary" id="clear">クリア</button></div>
<div id="status" class="status"></div><div id="errors" class="error-box hidden"></div>
<div class="info-box"><p>Arena cards欄にある装備・武器なども集計対象に含めます。</p></div>
<p class="hint">複数デッキは各デッキを <code>Name:</code> から始めてください。カード行は <code>2x Card Name (red)</code> の形式です。</p></section>
<section id="results" class="hidden"><div id="summary" class="grid"></div>
<section class="panel"><h2>色別集計</h2><div class="scroll"><table><thead><tr><th>色</th><th>デッキ数</th><th>合計枚数</th><th>平均枚数</th><th>カード種類数</th></tr></thead><tbody id="colors"></tbody></table></div></section>
<section class="panel"><div class="controls" style="justify-content:space-between;margin:0"><h2>カード別集計</h2><button class="secondary" id="csv">CSVをダウンロード</button></div><div class="scroll"><table><thead><tr><th>順位</th><th>カード名</th><th>色</th><th>総枚数</th><th>平均枚数</th><th>採用デッキ数</th><th>採用率</th></tr></thead><tbody id="cards"></tbody></table></div></section>
<section class="panel"><h2>デッキ別集計</h2><div class="scroll"><table><thead><tr><th>デッキ</th><th>ヒーロー</th><th>赤</th><th>黄</th><th>青</th><th>合計</th></tr></thead><tbody id="decks"></tbody></table></div></section></section></main>
<script>
const sample=`Name: Draft 1
Hero: Viserai, Between Worlds
Format: Draft

Arena cards
1x Dark Arcanite Helm
1x Grasp of the Darknight
1x Robe of Repentance
1x Seven Sin Nebula

Deck cards
2x Bloodfrenzy Gloomblade (red)
2x Breach Flesh (red)
1x Enshrine Sin (red)
1x Ghostly Visit (red)
3x Murmuring Gloomblade (red)
1x Otherworldly Sins (red)
2x Shadowake Gloomblade (red)
1x Tremor of i'Arathael (red)
2x Void Wraith (red)
2x Bloodfrenzy Gloomblade (yellow)
1x Embrace Ursur (yellow)
1x Ghostly Visit (yellow)
2x Pull from Beyond (yellow)
1x Runechant of Greed (yellow)
2x Runechant of Lust (yellow)
1x Runechant of Pride (yellow)
1x Shadowake Gloomblade (yellow)
2x Shadowrealm Bloodhound (yellow)
2x Step through Realms (yellow)
1x Vexing Gloomblade (yellow)
2x Bloodfrenzy Gloomblade (blue)
1x Breach Flesh (blue)
1x Embrace Ursur (blue)
1x Pull from Beyond (blue)
1x Seek Horizon (blue)
1x Whispers Within (blue)`;
const $=id=>document.getElementById(id),input=$("input"),labels={red:"赤",yellow:"黄",blue:"青"};let latest=[];
function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function parse(text){text=text.replace(/\r\n?/g,"\n").trim();const errors=[];if(!text)return{decks:[],errors:["入力が空です。デッキリストを貼り付けてください。"]};const m=[...text.matchAll(/^Name:\s*(.*)$/gim)],bs=m.length?m.map((x,i)=>text.slice(x.index,i+1<m.length?m[i+1].index:text.length)):[text];const decks=bs.map((b,i)=>{let section="deck",cards=[],name=(b.match(/^Name:\s*(.*)$/im)||[])[1]||`Deck ${i+1}`,hero=(b.match(/^Hero:\s*(.*)$/im)||[])[1]||"不明";for(const [idx,raw] of b.split("\n").entries()){const line=idx+1,l=raw.trim();if(!l||/^Name:|^Hero:|^Format:|^FaBraryで/i.test(l))continue;if(/^Arena cards/i.test(l)){section="arena";continue}if(/^Deck cards/i.test(l)){section="deck";continue}if(section==="arena"&&/^\d+\s*x?\s+.+$/.test(l)){const x=l.match(/^(\d+)\s*x?\s+(.+)$/);const qty=Number(x[1]);if(qty<=0)errors.push(`${name}: ${line}行目「${l}」— 枚数は1以上にしてください。`);else cards.push({name:x[2].trim(),qty,color:"arena",section});continue}if(/^\d+\s*x?\s+.+\s+\((red|yellow|blue)\)\s*$/i.test(l)){const x=l.match(/^(\d+)\s*x?\s+(.+?)\s+\((red|yellow|blue)\)\s*$/i);const qty=Number(x[1]);if(qty<=0)errors.push(`${name}: ${line}行目「${l}」— 枚数は1以上にしてください。`);else cards.push({name:x[2].trim(),qty,color:x[3].toLowerCase(),section});continue}if(/^(\d+)\s*x?\s+/.test(l))errors.push(`${name}: ${line}行目「${l}」— 色指定がありません。末尾に (red)、(yellow)、または (blue) を付けてください。`)}if(!cards.length)errors.push(`${name.trim()||`Deck ${i+1}`}: 集計可能なカードがありません。`);return{name:name.trim()||`Deck ${i+1}`,hero:hero.trim()||"不明",cards}}).filter(x=>x.cards.length);return{decks,errors}}
function showErrors(errors){const box=$("errors");if(!errors.length){box.classList.add("hidden");box.innerHTML="";return}box.classList.remove("hidden");box.innerHTML=`<h3>入力の確認事項（${errors.length}件）</h3><ul>${errors.map(e=>`<li>${esc(e)}</li>`).join("")}</ul><p class="small">上記の行は除外して、解析できるカードだけで集計しています。集計を中止したい場合は入力を修正してから再度分析してください。</p>`}
function analyze(){try{const parsed=parse(input.value),ds=parsed.decks;showErrors(parsed.errors);if(!ds.length){$("results").classList.add("hidden");$("status").className="status error";$("status").textContent="処理に失敗しました。解析可能なデッキがありません。下のエラー内容を確認してください。";return}const totals={red:0,yellow:0,blue:0},map=new Map(),rows=[];let grandTotal=0;for(const d of ds){const dt={red:0,yellow:0,blue:0};let deckTotal=0;for(const c of d.cards){const key=`${c.name}|||${c.color}`;deckTotal+=c.qty;if(c.color!=="arena"){dt[c.color]+=c.qty;totals[c.color]+=c.qty}if(!map.has(key))map.set(key,{name:c.name,color:c.color,total:0,set:new Set()});const x=map.get(key);x.total+=c.qty;x.set.add(d.name)}grandTotal+=deckTotal;rows.push({...dt,name:d.name,hero:d.hero,total:deckTotal});}const cards=[...map.values()].map(x=>({...x,count:x.set.size,avg:x.total/ds.length,rate:x.set.size/ds.length*100})).sort((a,b)=>b.avg-a.avg||a.name.localeCompare(b.name,"ja"));latest=cards;const cr=["red","yellow","blue"].map(c=>({c,total:totals[c],avg:totals[c]/ds.length,types:cards.filter(x=>x.color===c).length}));const totalAvg=grandTotal/ds.length;$("summary").innerHTML=`<div class="summary"><div class="label">分析デッキ数</div><div class="value">${ds.length}</div></div>${cr.map(x=>`<div class="summary ${x.c}"><div class="label">${labels[x.c]}の平均枚数</div><div class="value">${x.avg.toFixed(2)}</div></div>`).join("")}<div class="summary"><div class="label">デッキ合計の平均枚数</div><div class="value">${totalAvg.toFixed(2)}</div></div>`;$("colors").innerHTML=cr.map(x=>`<tr><td><span class="badge ${x.c}">${labels[x.c]}</span></td><td>${ds.length}</td><td>${x.total}</td><td>${x.avg.toFixed(2)}</td><td>${x.types}</td></tr>`).join("");$("cards").innerHTML=cards.length?cards.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${x.color==="arena"?"Arena":`<span class="badge ${x.color}">${labels[x.color]}</span>`}</td><td>${x.total}</td><td>${x.avg.toFixed(2)}</td><td>${x.count}</td><td>${x.rate.toFixed(1)}%</td></tr>`).join(""):`<tr><td colspan="7">対象カードがありません。</td></tr>`;$("decks").innerHTML=rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.hero)}</td><td>${x.red}</td><td>${x.yellow}</td><td>${x.blue}</td><td>${x.total}</td></tr>`).join("");$("results").classList.remove("hidden");$("status").className=parsed.errors.length?"status":"status ok";$("status").textContent=parsed.errors.length?`${ds.length}個のデッキを解析しました。ただし、${parsed.errors.length}件の確認事項があります。`:`${ds.length}個のデッキを解析しました。`}catch(error){$("results").classList.add("hidden");$("status").className="status error";$("status").textContent="処理中に予期しないエラーが発生しました。";showErrors([`${error.name||"Error"}: ${error.message||String(error)}`]);console.error(error)}}
$("analyze").onclick=analyze;$("sample").onclick=()=>{input.value=sample;analyze()};$("clear").onclick=()=>{input.value="";$("results").classList.add("hidden");$("status").textContent="";showErrors([])};$("csv").onclick=()=>{if(!latest.length)return;const rows=[["順位","カード名","色","総枚数","平均枚数","採用デッキ数","採用率"],...latest.map((x,i)=>[i+1,x.name,x.color,x.total,x.avg.toFixed(2),x.count,x.rate.toFixed(1)+"%"])] ;const csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="draft-card-analysis.csv";a.click()};input.value=sample;analyze();
</script></body></html>
